<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <title>Connect Canopy Code</title>
  <link rel="icon" type="image/png" href="../../assets/app-icon.png">
  <link rel="stylesheet" href="../../assets/styles.css">
  <style>
    main { min-height: 70vh; display: grid; place-items: center; }
    .pair-card { max-width: 440px; text-align: center; padding: 42px 28px; border-radius: 24px; background: #fffaf0; box-shadow: 0 20px 60px rgba(50, 35, 20, .14); }
    .pair-card img { width: 72px; height: 72px; border-radius: 18px; }
    .pair-card h1 { margin: 20px 0 10px; }
    .pair-card p { color: #65594d; line-height: 1.55; }
    .pair-card .button { display: inline-block; margin-top: 14px; }
    .pair-error { color: #a4332e; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="pair-card" aria-labelledby="title">
      <img src="../../assets/app-icon.png" alt="CanopyChat">
      <h1 id="title">Connect Canopy Code</h1>
      <p id="message">Opening CanopyChat so you can approve this computer.</p>
      <a id="open-app" class="button" href="/">Open CanopyChat</a>
    </section>
  </main>
  <script src="../../assets/remote-control-pair.js"></script>
</body>
</html>
